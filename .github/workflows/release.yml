name: Release

# Tag vX.Y.Z on main → publish @imstudium/{contract,sdk,cli,mcp} to the
# registry each package's publishConfig names. For now that is GitHub Packages
# (npm.pkg.github.com), with this workflow's own GITHUB_TOKEN. Back on
# npmjs.com it is npm trusted publishing (OIDC) with provenance, and there is
# no npm token anywhere. One script covers both: scripts/release-publish.sh.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # registry-url and scope write the .npmrc that sends @imstudium to GitHub
      # Packages with NODE_AUTH_TOKEN; the publish steps set it to GITHUB_TOKEN.
      # Trusted publishing on npmjs.com needs npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@imstudium"

      - name: npm >= 11.5.1
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in contract sdk cli mcp; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if [ "$v" != "$tag" ]; then echo "packages/$p is $v, tag is $GITHUB_REF_NAME" >&2; exit 1; fi
          done
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      - name: Generated docs are current
        run: bun run docs:check

      # Order = topological order of the internal dependencies
      # (scripts/release-order.test.ts keeps these steps in that order).
      - name: Publish contract
        run: bash scripts/release-publish.sh contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish sdk
        run: bash scripts/release-publish.sh sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish cli
        run: bash scripts/release-publish.sh cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish mcp
        run: bash scripts/release-publish.sh mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
