name: Release

# Tag vX.Y.Z on main → publish @imstudium/sdk with npm trusted publishing
# (OIDC) and provenance. It is the one public package: the imstudium CLI and
# the imstudium-mcp server ship inside it (scripts/assemble-sdk.ts); contract,
# cli and mcp are private workspace packages. There is no npm token anywhere:
# @imstudium/sdk on npmjs.com trusts this repository and this workflow file.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Trusted publishing needs npm >= 11.5.1 (Node 24 ships 11.x; make sure).
      # No registry-url: setup-node would export a placeholder NODE_AUTH_TOKEN;
      # the registry comes from each package's publishConfig.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm >= 11.5.1
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in contract sdk cli mcp; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if [ "$v" != "$tag" ]; then echo "packages/$p is $v, tag is $GITHUB_REF_NAME" >&2; exit 1; fi
          done
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      - name: Generated docs are current
        run: bun run docs:check

      - name: Assemble @imstudium/sdk
        run: bun scripts/assemble-sdk.ts

      - name: Publish @imstudium/sdk
        run: bash scripts/release-publish.sh
